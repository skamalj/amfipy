site_name: amfipy
site_description: Python client for AMFI India — NAV, TER, AUM, Tracking Error and more
site_url: https://skamalj.github.io/amfipy
repo_url: https://github.com/skamalj/amfipy
repo_name: skamalj/amfipy
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - API Reference:
    - api/index.md
    - NAV: api/nav.md
    - TER (MF): api/ter.md
    - TER (SIF): api/sif_ter.md
    - Fund Performance: api/fund_performance.md
    - Tracking: api/tracking.md
    - Risk Parameters: api/risk_parameters.md
    - NFO: api/nfo.md
    - Publications: api/publications.md
    - CDMDF NAV: api/cdmdf.md
    - AUM: api/aum.md
    - Other Data: api/other_data.md
    - Research: api/research.md
  - Data Dictionary:
    - data/index.md
    - NAV Data: data/nav.md
    - TER Data: data/ter.md
    - Fund Performance: data/fund_performance.md
    - Tracking: data/tracking.md
    - Risk Parameters: data/risk_parameters.md
    - NFO: data/nfo.md
    - Publications: data/publications.md
    - CDMDF NAV: data/cdmdf.md
    - AUM: data/aum.md
    - Other Data: data/other_data.md
    - Research: data/research.md
